name: Sync module branches

# GitHub does not notify a repository when a submodule it points at
# moves, so the catalog polls for it.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-modules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Advance submodule pointers to their branch tips
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --remote
          git add submodules
          if git diff --cached --quiet; then
            echo "no submodule pointers moved"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "sync: advance submodule pointers"
            git push
          fi

  # Released here rather than by dispatching release-all.yml: a push made
  # with GITHUB_TOKEN does not trigger `on: push`, and an API
  # workflow_dispatch made with it does not create a run.
  release:
    needs: sync
    strategy:
      fail-fast: false
      matrix:
        module_path:
          - submodules/logos-delivery-module
          - submodules/logos-chat-module
          - submodules/logos-rln-modules/logos-rln-module
          - submodules/logos-rln-modules/logos-lez-rln-module
          - submodules/logos-execution-zone-module
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: ${{ matrix.module_path }}
    secrets: inherit
