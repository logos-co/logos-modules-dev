name: Prune old builds

# Retention for a continuous-build catalog.
#
# Publishing one release per module commit makes releases accumulate
# without bound, and rebuild-index DOWNLOADS every published `.lgx` on
# each run to read its manifest. Left alone, the index rebuild degrades
# from minutes to hours within weeks. This workflow keeps the newest
# `keep` builds per module and deletes the rest, releases and tags
# alike.
#
# Only tags matching `<module>-<12 hex>` are ever considered, so a
# hand-cut `<module>-v<version>` release and the rolling `index`
# release are never touched.

on:
  schedule:
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: "How many builds to keep per module."
        type: string
        default: "10"
      dry_run:
        description: "List what would be deleted and stop."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: prune-builds
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete builds beyond the retention window
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP: ${{ inputs.keep || '10' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if ! [[ "${KEEP}" =~ ^[0-9]+$ ]] || [ "${KEEP}" -lt 1 ]; then
            echo "::error::keep must be a positive integer (got '${KEEP}')"; exit 1
          fi

          # jq, not awk: the runner's /usr/bin/awk is mawk, whose support
          # for `{12}` interval expressions is not something to rely on.
          gh api "repos/${GH_REPO}/releases" --paginate \
            --jq '.[] | {tag: .tag_name, created: .created_at}' \
            | jq -sc . > releases.json
          echo "::notice::${GH_REPO} has $(jq length releases.json) release(s)"

          deleted=0
          while read -r name; do
            mapfile -t doomed < <(
              jq -r --arg n "${name}" --argjson keep "${KEEP}" '
                [ .[] | select(.tag | test("^\($n)-[0-9a-f]{12}$")) ]
                | sort_by(.created) | reverse | .[$keep:] | .[].tag
              ' releases.json
            )
            [ "${#doomed[@]}" -eq 0 ] && { echo "  ${name}: nothing to prune"; continue; }
            echo "  ${name}: pruning ${#doomed[@]} build(s)"
            for tag in "${doomed[@]}"; do
              if [ "${DRY_RUN}" = "true" ]; then
                echo "    would delete ${tag}"
              else
                echo "    deleting ${tag}"
                gh release delete "${tag}" --repo "${GH_REPO}" --cleanup-tag --yes
                deleted=$((deleted + 1))
              fi
            done
          done < <(jq -r '.modules[].name' modules.json)

          echo "deleted=${deleted}" >> "$GITHUB_ENV"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::dry run — nothing was deleted"
          else
            echo "::notice::deleted ${deleted} release(s)"
          fi

      # The index still advertises anything just deleted, so rebuild it.
      - name: Trigger rebuild-index workflow
        if: ${{ env.deleted != '0' }}
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          event-type: rebuild-index
