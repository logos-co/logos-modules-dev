name: Release chat_ui

# Generated from release-module.yml.template by scripts/add-module.sh.

on:
  workflow_dispatch:
    inputs:
      module_ref:
        description: 'Branch, tag or commit to build. Blank = tip of the branch in .gitmodules; "pointer" = the submodule pointer.'
        type: string
        default: ""
      force_build:
        description: "Force build — replace the release for the module's current commit."
        type: boolean
        default: false
      variants:
        description: 'Comma-separated variants to build, e.g. "darwin-arm64,linux-amd64,linux-arm64". Blank = the module''s variants in .gitmodules, else all.'
        type: string
        default: ""

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/logos-chat-ui
      module_ref: ${{ inputs.module_ref }}
      force_build: ${{ inputs.force_build }}
      variants: ${{ inputs.variants }}
    secrets: inherit
