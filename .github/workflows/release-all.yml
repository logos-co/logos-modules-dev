name: Release all modules

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the release for each module's current commit."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        module_path:
          - submodules/logos-delivery-module
          - submodules/logos-chat-module
          - submodules/logos-execution-zone-module
          - submodules/openmetrics-module
          - submodules/logos-delivery-demo
          - submodules/logos-chat-ui
          - submodules/logos-storage-module
          - submodules/logos-blockchain-module
          - submodules/logos-accounts-ui
          - submodules/logos-libp2p-module
          - submodules/logos-rln-module
          - submodules/logos-rln-lez-module
          - submodules/logos-membership-allocation-client-module
          - submodules/logos-membership-allocation-module
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: ${{ matrix.module_path }}
      force_build: ${{ inputs.force_build }}
    secrets: inherit
