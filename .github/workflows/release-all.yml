name: Release all modules

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the release for each module's current commit."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        # Not derivable from .gitmodules: logos-rln-modules holds two modules.
        module_path:
          - submodules/logos-delivery-module
          - submodules/logos-chat-module
          - submodules/logos-rln-modules/logos-rln-module
          - submodules/logos-rln-modules/logos-lez-rln-module
          - submodules/logos-execution-zone-module
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: ${{ matrix.module_path }}
      force_build: ${{ inputs.force_build }}
    secrets: inherit
