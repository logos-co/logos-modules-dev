name: CI

# modules.json is the module list, and the per-module workflows are
# generated from it. Nothing at run time notices when the two drift —
# a module added to modules.json without regenerating simply has no
# workflow — so check it here.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: modules.json is valid and complete
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.modules | length > 0' modules.json > /dev/null
          jq -e 'all(.modules[]; has("name") and has("path"))' modules.json > /dev/null
          dupes="$(jq -r '.modules[].name' modules.json | sort | uniq -d)"
          [ -z "${dupes}" ] || { echo "::error::duplicate module name(s): ${dupes}"; exit 1; }
          # Every module path must sit inside a declared submodule.
          jq -r '.modules[].path' modules.json | while read -r p; do
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
              | awk '{print $2}' \
              | grep -qx -e "${p}" -e "$(echo "${p}" | cut -d/ -f1-2)" \
              || { echo "::error::${p} is not inside any declared submodule"; exit 1; }
          done

      - name: every submodule tracks a branch
        shell: bash
        run: |
          set -euo pipefail
          # sync-modules.yml advances a submodule by reading this; one
          # without a branch would silently never be built again.
          missing=0
          while read -r sub; do
            if ! git config -f .gitmodules --get "submodule.${sub}.branch" > /dev/null; then
              echo "::error::submodule ${sub} has no 'branch' in .gitmodules"
              missing=1
            fi
          done < <(git config -f .gitmodules --name-only --get-regexp '^submodule\..*\.path$' \
                   | sed -e 's/^submodule\.//' -e 's/\.path$//')
          exit "${missing}"

      - name: per-module workflows match modules.json
        run: ./scripts/sync-workflows.sh --check

      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
