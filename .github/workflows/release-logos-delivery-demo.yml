name: Release logos_delivery_demo

# Generated from release-module.yml.template by scripts/add-module.sh.

on:
  workflow_dispatch:
    inputs:
      module_ref:
        description: 'Branch, tag or commit to build. Blank = tip of the branch in .gitmodules; "pointer" = the submodule pointer.'
        type: string
        default: ""
      force_build:
        description: "Force build — replace the release for the module's current commit."
        type: boolean
        default: false

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/logos-delivery-demo
      module_ref: ${{ inputs.module_ref }}
      force_build: ${{ inputs.force_build }}
    secrets: inherit
