name: Release lez_core

# Manually-triggered release for a single module. Delegates the
# build / verify / sign / publish pipeline to the local
# _release-module.yml reusable workflow so the tag scheme and signing
# config live in exactly one place.
#
# Source of truth for module name + version is
# submodules/logos-execution-zone-module/metadata.json — read by the upstream
# logos-modules-release-action.
#
# This file is generated by scripts/sync-workflows.sh from
# release-module.yml.template, one per entry in modules.json. Don't
# hand-edit it; edit the template (affects every module) or
# _release-module.yml (shared pipeline config) and re-run the script.

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the release for the module's current commit."
        type: boolean
        default: false

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/logos-execution-zone-module
      force_build: ${{ inputs.force_build }}
    secrets: inherit
